name: Portable release boot

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/portable-release.yml'
  workflow_dispatch:

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Ship and uv
        run: python -m pip install -e . uv==0.13.3
      - name: Build disposable production release
        run: |
          python scripts/prepare_release_fixture.py dist/ci-release
          cp scripts/boot_release_fixture.sh dist/ci-release/boot-check.sh
          tar -C dist -czf ci-release.tar.gz ci-release
      - name: Validate the complete canonical release
        uses: ship-ecosystem/spec@a201f5f5b6c1fe6cc5834fb6073da275decaf09a
        with:
          path: dist/ci-release
      - name: Transfer release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-only-release
          path: ci-release.tar.gz
          if-no-files-found: error

  boot:
    name: Boot on a fresh Docker runner
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-only-release
      - name: Load images and verify deployment
        run: |
          tar -xzf ci-release.tar.gz
          sh ci-release/boot-check.sh ci-release
