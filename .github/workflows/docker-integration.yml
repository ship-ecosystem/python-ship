name: Docker integration

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/docker-integration.yml'
  schedule:
    # Weekly, so a changed upstream image or base image is caught between commits.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: docker-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  development:
    name: 'Development: plain ASGI, Django, FastAPI'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Ship and uv
        run: python -m pip install -e . uv==0.13.3
      - name: Real development stacks for each app type
        env:
          SHIP_DOCKER_TEST: '1'
        run: python scripts/run_ci_test.py tests.test_docker_development -v

  services-data:
    name: 'Services: databases, cache, mail, search, npm, uv'
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Ship and uv
        run: python -m pip install -e . uv==0.13.3
      - name: Live service checks
        env:
          SHIP_DOCKER_TEST: '1'
        run: >-
          python scripts/run_ci_test.py tests.test_docker_services -v
          -k postgres -k mysql -k mailpit -k meilisearch -k node -k dependency

  services-browsers-storage:
    name: 'Services: browsers and S3 storage'
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Ship and uv
        run: python -m pip install -e . uv==0.13.3
      - name: Live service checks
        env:
          SHIP_DOCKER_TEST: '1'
        run: >-
          python scripts/run_ci_test.py tests.test_docker_services -v
          -k playwright -k selenium -k garage -k seaweedfs -k rustfs -k silo

  production:
    name: 'Production images: plain ASGI, Django, FastAPI'
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Ship and uv
        run: python -m pip install -e . uv==0.13.3
      - name: Build and run production images
        env:
          SHIP_PRODUCTION_DOCKER_TEST: '1'
        run: python scripts/run_ci_test.py tests.test_docker_production -v

  releases:
    name: Releases booted from a source-free directory
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Ship and uv
        run: python -m pip install -e . uv==0.13.3
      - name: Release, load and boot each app type
        env:
          SHIP_RELEASE_DOCKER_TEST: '1'
        run: python scripts/run_ci_test.py tests.test_docker_release -v

  community-extensions:
    name: Installed community adapter and service
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Ship and uv
        run: python -m pip install -e . uv==0.13.3
      - name: Build and install the example distributions
        run: |
          uv build --wheel --out-dir dist/examples examples/community-service
          uv build --wheel --out-dir dist/examples examples/community-adapter
          python -m pip install --no-deps dist/examples/*.whl
      - name: Entry points, Docker stacks and releases
        env:
          SHIP_EXAMPLE_PLUGINS_TEST: '1'
          SHIP_EXAMPLE_DOCKER_TEST: '1'
        run: python scripts/run_ci_test.py tests.test_extensions -v

  mutagen:
    name: Mutagen sync and reload
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Ship and uv
        run: python -m pip install -e . uv==0.13.3
      - name: Install pinned Mutagen CLI
        run: |
          curl --fail --show-error --silent --location --output /tmp/mutagen.tar.gz https://github.com/mutagen-io/mutagen/releases/download/v0.18.1/mutagen_linux_amd64_v0.18.1.tar.gz
          echo '7735286c778cc438418209f24d03a64f3a0151c8065ef0fe079cfaf093af6f8f  /tmp/mutagen.tar.gz' | sha256sum --check
          mkdir -p /tmp/ship-mutagen-bin
          tar -xzf /tmp/mutagen.tar.gz -C /tmp/ship-mutagen-bin mutagen mutagen-agents.tar.gz
          echo /tmp/ship-mutagen-bin >> "$GITHUB_PATH"
          /tmp/ship-mutagen-bin/mutagen version
      - name: Live file sync and reload
        env:
          SHIP_MUTAGEN_TEST: '1'
        run: python scripts/run_ci_test.py tests.test_mutagen.LiveMutagenTests -v
