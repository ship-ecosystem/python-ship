[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "python-ship"
version = "0.1.0.dev5"
description = "Docker development environments for Python web apps"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "python-ship"}]
keywords = ["docker", "compose", "django", "fastapi", "development"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["typer>=0.27,<0.30"]

[project.scripts]
ship = "python_ship.cli:main"

[project.urls]
Repository = "https://github.com/ship-ecosystem/python-ship"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
python_ship = ["templates/Dockerfile", "templates/garage/Dockerfile", "templates/garage/garage.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src/python_ship"]
ignore_missing_imports = true
show_error_codes = true
