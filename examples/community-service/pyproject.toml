[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-ship-example-http-service"
version = "0.1.0"
description = "Installable HTTP service extension example for Python Ship"
requires-python = ">=3.11"
dependencies = ["python-ship>=0.1.0.dev5,<0.2"]

[project.entry-points."python_ship.services"]
example-http = "ship_example_http_service:ExampleHttpService"

[tool.setuptools.packages.find]
where = ["src"]
