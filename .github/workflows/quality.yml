name: Quality and packaging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests and distributions / Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned uv
        run: python -m pip install uv==0.13.3
      - name: Lint, type, unit, Compose, and package checks
        env:
          SHIP_UV_INSTALL_TEST: '1'
        run: python scripts/run_ci_check.py

  supported-platforms:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            typer: typer==0.27.0
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.15'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Ship and schema validator
        run: python -m pip install -e . jsonschema==4.26.0 ${{ matrix.typer }}
      - name: Run platform unit tests
        env:
          SHIP_UV_INSTALL_TEST: ${{ runner.os != 'Linux' && '1' || '0' }}
        run: python scripts/run_ci_test.py discover -s tests -t .

  spec:
    name: Offline schemas match the shared spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python scripts/check_spec.py
