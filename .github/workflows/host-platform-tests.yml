name: Host platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uv-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Run platform unit tests
        run: python scripts/run_ci_test.py tests.test_phase5 tests.test_mutagen_phase5 -v
      - name: Run real uv installer test
        env:
          SHIP_UV_INSTALL_TEST: '1'
        run: python scripts/run_ci_test.py tests.test_phase5.PhaseFiveTests.test_official_uv_installer_in_isolated_home -v
