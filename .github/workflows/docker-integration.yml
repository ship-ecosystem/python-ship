name: Docker integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frameworks:
    name: Development adapters and services
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e . uv==0.13.3
      - name: Verify Docker-backed framework and network paths
        env:
          SHIP_DOCKER_TEST: '1'
        run: python scripts/run_ci_test.py tests.test_frameworks.FrameworkDockerTests tests.test_phase3_docker.PhaseThreeDockerTests tests.test_phase5_docker.ConcurrentProjectsTests -v

  services:
    name: Stateful services and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e . uv==0.13.3
      - name: Verify selected infrastructure services
        env:
          SHIP_DOCKER_TEST: '1'
        run: >-
          python scripts/run_ci_test.py
          tests.test_service_catalog_docker.ServiceCatalogDockerTests.test_mysql_application_user_and_separate_root
          tests.test_service_catalog_docker.ServiceCatalogDockerTests.test_postgres_and_redis_data_survive_container_restart
          tests.test_service_catalog_docker.ServiceCatalogDockerTests.test_mailpit_smtp_and_web_ui
          tests.test_service_catalog_docker.ServiceCatalogDockerTests.test_node_npm_and_hmr_port
          -v

  production:
    name: Production builds and restart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e . uv==0.13.3
      - name: Verify generic, Django, and FastAPI production images
        env:
          SHIP_PRODUCTION_MATRIX_TEST: '1'
        run: python scripts/run_ci_test.py tests.test_phase6_docker.ProductionDockerTests -v

  community-extensions:
    name: Installed community adapter and service
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e . uv==0.13.3
      - name: Build and install extension wheels
        run: |
          uv build --wheel --out-dir dist/examples examples/community-service
          uv build --wheel --out-dir dist/examples examples/community-adapter
          python -m pip install --no-deps dist/examples/*.whl
      - name: Verify installed entry points and Docker release paths
        env:
          SHIP_EXAMPLE_PLUGINS_TEST: '1'
          SHIP_EXAMPLE_DOCKER_TEST: '1'
        run: python scripts/run_ci_test.py tests.test_phase8.InstalledExamplePlugins tests.test_phase8_docker.InstalledExamplesDockerTests -v

  mutagen:
    name: Mutagen sync and reload
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e . uv==0.13.3
      - name: Install pinned Mutagen CLI
        run: |
          curl --fail --show-error --silent --location --output /tmp/mutagen.tar.gz https://github.com/mutagen-io/mutagen/releases/download/v0.18.1/mutagen_linux_amd64_v0.18.1.tar.gz
          echo '7735286c778cc438418209f24d03a64f3a0151c8065ef0fe079cfaf093af6f8f  /tmp/mutagen.tar.gz' | sha256sum --check
          mkdir -p /tmp/ship-mutagen-bin
          tar -xzf /tmp/mutagen.tar.gz -C /tmp/ship-mutagen-bin mutagen mutagen-agents.tar.gz
          echo /tmp/ship-mutagen-bin >> "$GITHUB_PATH"
          /tmp/ship-mutagen-bin/mutagen version
      - name: Verify live file sync and reload
        env:
          SHIP_MUTAGEN_TEST: '1'
        run: python scripts/run_ci_test.py tests.test_mutagen_phase5.MutagenTests.test_live_sync_reload_and_cleanup -v
