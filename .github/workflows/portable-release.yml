name: Portable release boot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Ship and uv
        run: python -m pip install -e . uv==0.13.3
      - name: Build disposable production release
        run: |
          python scripts/prepare_release_fixture.py dist/ci-release
          cp scripts/boot_release_fixture.sh dist/ci-release/boot-check.sh
          tar -C dist -czf ci-release.tar.gz ci-release
      - name: Transfer release archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: docker-only-release
          path: ci-release.tar.gz
          if-no-files-found: error

  boot:
    name: Boot on fresh Docker runner
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archive
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: docker-only-release
      - name: Load images and verify deployment
        run: |
          tar -xzf ci-release.tar.gz
          sh ci-release/boot-check.sh ci-release
