[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "python-ship"
dynamic = ["version"]
description = "Framework-agnostic, cross-platform Docker development environment and portable releases for Python web apps."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{name = "python-ship"}]
keywords = ["docker", "docker-compose", "development-environment", "asgi", "django", "fastapi", "uv", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed",
]
dependencies = ["typer>=0.27,<1", "questionary>=2.1,<3"]

[project.scripts]
ship = "python_ship.cli:main"

[project.urls]
Homepage = "https://github.com/ship-ecosystem/python-ship"
Documentation = "https://github.com/ship-ecosystem/python-ship#readme"
Repository = "https://github.com/ship-ecosystem/python-ship"
Issues = "https://github.com/ship-ecosystem/python-ship/issues"
Changelog = "https://github.com/ship-ecosystem/python-ship/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "python_ship.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
python_ship = [
    "py.typed",
    "schema/*.json",
    "templates/Dockerfile",
    "templates/app-entrypoint.py",
    "templates/check-python-security-floor.py",
    "templates/garage/Dockerfile",
    "templates/garage/garage.toml",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.mypy]
files = ["src/python_ship"]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
